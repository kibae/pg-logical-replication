# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js(22,24,26) w/Postgres 18

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    services:
      postgres:
        image: kibaes/postgres-logical-replication-dev:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespw
          POSTGRES_DB: playground
        ports:
          - "5432:5432"
        # Use TCP so the temporary initdb server cannot pass the readiness check.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d playground"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Info
      run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "NPM cache: $(npm config get cache)"
    - name: Install/Build
      run: |
        npm ci
        npm run build
    - name: Test
      run: npm test
    - uses: phoenix-actions/test-reporting@v8
      # Fork PR tokens cannot create checks; the Test step still determines the result.
      if: >-
        (success() || failure()) &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.full_name == github.repository)
      id: test-report
      with:
        name: JEST Tests (${{ matrix.node-version }}, Postgres 18)
        path: junit.xml
        reporter: jest-junit
        token: ${{ secrets.GITHUB_TOKEN }}
